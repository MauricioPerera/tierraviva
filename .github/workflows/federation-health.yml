name: Salud de la federación

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping a pares y directorio
        run: node tools/fed-health.js
